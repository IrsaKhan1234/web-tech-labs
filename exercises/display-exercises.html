<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Property Showcase</title>
    <link rel="stylesheet" href="../styles/display.css">
</head>
<body>

<h1>Lab 05 - Task 1: Display Properties</h1>

<div class="section">
    <h2>Block vs Inline vs Inline-Block</h2>

    <div class="box block">Block 1</div>
    <div class="box block">Block 2</div>

    <hr>

    <span class="box inline">Inline 1</span>
    <span class="box inline">Inline 2</span>

    <hr>

    <div class="box inline-block">Inline-Block 1</div>
    <div class="box inline-block">Inline-Block 2</div>
</div>

<div class="section responsive">
    <h2>Responsive Visibility</h2>
    <div class="hide-mobile">Visible on Desktop only</div>
    <div class="show-mobile">Visible on Mobile only</div>
</div>

</body>
</html>
