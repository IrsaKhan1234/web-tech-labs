<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 14: Responsive Table</title>
    <link rel="stylesheet" href="../styles/responsive.css">
</head>
<body>
<h2>Customer Order Summary</h2>
<table class="res-table">
    <thead>
    <tr><th>Order ID</th><th>Product</th><th>Status</th><th>Price</th></tr>
    </thead>
    <tbody>
    <tr>
        <td data-label="Order ID">#9982</td>
        <td data-label="Product">Velvet Suit</td>
        <td data-label="Status">Shipped</td>
        <td data-label="Price">Rs. 12,500</td>
    </tr>
    </tbody>
</table>
</body>
</html>
